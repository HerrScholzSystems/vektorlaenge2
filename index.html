<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>Vektor Tool 2D - Pro V9</title>
    <!-- KaTeX: rendert die LaTeX-Formel in Hinweis 5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <style>
        html, body { overscroll-behavior: none; }
        body {
            margin: 0; overflow: hidden; background-color: #ffffff;
            font-family: -apple-system, sans-serif; touch-action: none;
            -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
        }
        button { box-sizing: border-box; }

        /* --- Rechtes Dock (Anzeige + Werkzeuge + Hilfebereich), nach rechts ein-/ausklappbar --- */
        #right-dock {
            position: absolute;
            right: calc(20px + env(safe-area-inset-right));
            top: calc(20px + env(safe-area-inset-top));
            z-index: 100;
            max-height: calc(100vh - 40px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            overflow-y: auto; -webkit-overflow-scrolling: touch;
            transition: transform 0.35s cubic-bezier(.4,0,.2,1);
        }
        body.panels-collapsed #right-dock { transform: translateX(calc(100% + 80px)); }

        .panel {
            background: rgba(255,255,255,0.95); padding: 12px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); width: 180px; margin-bottom: 14px;
        }

        /* Toggle-Griff: mittig direkt links am Menü (wie menue.html) */
        #panel-toggle {
            position: absolute; top: 50%; right: 208px; transform: translateY(-50%);
            z-index: 200; width: 30px; height: 64px;
            background: rgba(255,255,255,0.95); border: 1px solid #ccc; border-right: none;
            border-radius: 10px 0 0 10px; box-shadow: -2px 2px 12px rgba(0,0,0,0.12);
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; color: #007AFF; cursor: pointer;
            user-select: none; -webkit-user-select: none; touch-action: manipulation;
            transition: right 0.35s cubic-bezier(.4,0,.2,1);
        }
        body.panels-collapsed #panel-toggle { right: env(safe-area-inset-right); }

        #instruction-toast {
            display: none; position: fixed; top: calc(20px + env(safe-area-inset-top)); left: 50%;
            transform: translateX(-50%);
            background: #007AFF; color: white; padding: 12px 24px; border-radius: 25px;
            z-index: 1000; font-size: 14px; font-weight: bold;
        }

        .toggle-btn, .action-btn {
            display: block; width: 100%; margin-bottom: 6px; padding: 10px;
            border: 1px solid #ccc; border-radius: 8px; background: #fff;
            font-size: 12px; cursor: pointer; text-align: left;
            min-height: 44px; touch-action: manipulation;
        }
        .toggle-btn.active, .action-btn.active { background: #e3f2fd; border-color: #007AFF; font-weight: bold; }

        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 1000; justify-content: center; align-items: center;
        }
        #point-modal { background: white; padding: 20px; border-radius: 15px; width: 300px; max-width: 90vw; box-sizing: border-box; text-align: center; }

        /* Koordinaten-Eingabe horizontal als ( x₁ | x₂ ) */
        .coord-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 16px 0; }
        .coord-paren { font-size: 34px; line-height: 1; color: #333; }
        .coord-sep { font-size: 28px; line-height: 1; color: #999; }
        .modal-input {
            width: 72px; padding: 10px 6px; border: 1px solid #ccc; border-radius: 6px;
            font-size: 16px; text-align: center; box-sizing: border-box;
            -webkit-user-select: text; user-select: text;
        }
        .modal-input::placeholder { color: #aaa; }
        /* Grauer Platzhalter (x₁, x₂) verschwindet, sobald ins Feld getippt wird */
        .modal-input:focus::placeholder { color: transparent; }

        .axis-label { font-size: 20px; font-weight: bold; color: #000; pointer-events: none; }
        .tick-label { font-size: 11px; color: #000; font-weight: bold; pointer-events: none; }

        /* Punktbeschriftung: exakt dieselbe Farbe wie die Punkte selbst (Darkred),
           mit weißer Kontur (2.1px) für Lesbarkeit auf jedem Kartenuntergrund. */
        .point-label {
            font-size: 18px; font-weight: bold; color: #8b0000; pointer-events: none;
            -webkit-text-stroke: 2.1px #fff; paint-order: stroke fill;
        }

        /* Weiße Seitennamen mit schwarzem Kontrast-Schatten */
        .side-label {
            font-family: "Times New Roman", serif; font-style: italic; font-size: 22px;
            color: #ffffff; pointer-events: none; background: none !important;
            text-shadow: 1px 1px 2px #000, -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000;
        }

        /* Koordinaten-Popup mit Papierkorb – pointer-events: auto trotz CSS2D-Layer */
        .coord-popup {
            background: rgba(255,255,255,0.97); border: 1px solid #ccc; border-radius: 10px;
            padding: 8px 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.28);
            display: flex; align-items: center; gap: 8px;
            font-size: 14px; font-weight: bold; color: #8b0000; white-space: nowrap;
            pointer-events: auto;
        }
        .del-btn {
            width: 36px; height: 36px; border: none; border-radius: 8px;
            background: #ffe9e7; font-size: 18px; line-height: 1; cursor: pointer;
            pointer-events: auto; touch-action: manipulation;
            display: flex; align-items: center; justify-content: center;
        }
        .del-btn:active { background: #ffc9c2; }

        #zoom-controls {
            position: absolute; bottom: calc(30px + env(safe-area-inset-bottom));
            right: calc(30px + env(safe-area-inset-right));
            display: flex; flex-direction: column; gap: 12px; z-index: 100;
        }
        .control-btn {
            width: 60px; height: 60px; border-radius: 50%; background: white; border: 2px solid #007AFF;
            font-size: 30px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); cursor: pointer; color: #007AFF;
            touch-action: manipulation;
        }

        /* --- Hilfebereich: Overlay mit Flip-Karten (Prinzip wie helpdesk.html) --- */
        #help-overlay {
            display: none; position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.5); align-items: center; justify-content: center;
            box-sizing: border-box;
            padding: calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
                      calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
        }
        #help-overlay.active { display: flex; }
        .help-modal {
            background: #f4f7f9; border-radius: 16px; width: min(600px, 92vw);
            max-height: 85vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding: 20px; box-sizing: border-box;
        }
        .help-modal h2 { margin: 0 0 14px 0; font-size: 16px; color: #003366; text-align: center; }
        .help-close-btn {
            background: #6c757d; color: white; border: none; padding: 10px 18px; border-radius: 8px;
            cursor: pointer; margin-bottom: 16px; font-weight: bold; touch-action: manipulation;
            min-height: 44px;
        }
        .help-close-btn:hover { background: #5a6268; }

        .help-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px;
        }
        .help-card-container { perspective: 1000px; height: 190px; touch-action: manipulation; }
        .help-card {
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.05, 0.2, 1); cursor: pointer;
            touch-action: manipulation;
        }
        .help-card:hover { transform: scale(1.02); }
        .help-card.flipped { transform: rotateY(180deg); }
        .help-card.flipped:hover { transform: rotateY(180deg) scale(1.02); }
        .help-card-face {
            position: absolute; inset: 0; backface-visibility: hidden; border-radius: 12px;
            border: 1px solid #ddd; box-shadow: 0 4px 10px rgba(0,0,0,0.08); box-sizing: border-box;
            padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; background: white;
        }
        .help-card-front .help-icon { font-size: 2em; margin-bottom: 6px; }
        .help-card-front .help-title { font-weight: bold; font-size: 0.88em; color: #333; }
        .help-card-back {
            transform: rotateY(180deg); border: 2px solid #007AFF; overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            align-items: flex-start; justify-content: flex-start; text-align: left;
            font-size: 0.82em; line-height: 1.45; color: #333;
        }
        .help-card-back p { margin: 0; }
        .help-formula { margin-top: 10px; width: 100%; text-align: center; font-size: 1.05em; white-space: nowrap; }

        /* Hinweis 5 (LaTeX-Formel): Karte verdoppelt beim Umklappen ihre Breite,
           damit die Formel in einer Zeile passt. */
        .help-card-container.help-card-container-wide { grid-column: span 2; }

        /* Orangener "Tipp im Tool anwenden"-Button, erscheint mittig unten in der
           Karte, nachdem der Hinweis eine Weile aufgedeckt war. 44px Mindesthöhe
           als Touch-Target (Apple-Empfehlung). */
        .help-apply-btn {
            margin-top: auto; align-self: center; background: #ff9500; color: white; border: none;
            border-radius: 8px; padding: 10px 14px; font-size: 0.78em; font-weight: bold;
            cursor: pointer; touch-action: manipulation; min-height: 44px;
        }
        .help-apply-btn:active { background: #e68a00; }

        /* Rückmeldung nach Klick auf "Tipp im Tool anwenden" */
        .help-feedback {
            display: none; background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7;
            border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 0.85em;
            font-weight: bold; text-align: center;
        }
        .help-feedback.info { background: #fff3cd; color: #856404; border-color: #ffe69c; }
        .help-feedback.show { display: block; }

        /* Gesperrte Hinweis-Karten + Timer + Entsperr-Animation (Prinzip wie helpdesk.html) */
        .help-timer { font-size: 0.75em; color: #d9534f; margin-top: 8px; font-weight: bold; transition: color 0.3s ease; }
        .help-timer.ready { color: #28a745; }
        .help-card.locked { opacity: 0.55; pointer-events: none; filter: grayscale(15%); }
        .help-card-front .help-icon { transition: transform 0.4s ease; }
        .help-card.locked .help-card-front .help-icon { animation: helpLockPulse 2.4s ease-in-out infinite; }
        @keyframes helpLockPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        @keyframes helpUnlockPop {
            0% { transform: scale(0.7) rotate(-8deg); opacity: 0; }
            60% { transform: scale(1.15) rotate(4deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .help-icon.pop { animation: helpUnlockPop 0.5s ease; }
        .placeholder-note { color: #999; font-style: italic; }
    </style>
</head>
<body>

    <div id="instruction-toast">Wähle drei Punkte aus</div>

    <div id="modal-overlay">
        <div id="point-modal">
            <h3 style="margin-top:0">Neuer Punkt</h3>
            <div class="coord-row">
                <span class="coord-paren">(</span>
                <input type="number" id="mod-x1" class="modal-input" placeholder="x₁">
                <span class="coord-sep">|</span>
                <input type="number" id="mod-x2" class="modal-input" placeholder="x₂">
                <span class="coord-paren">)</span>
            </div>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="action-btn" style="background:#eee" onclick="closeModal()">Abbrechen</button>
                <button class="action-btn active" onclick="confirmPointCreation()">Erstellen</button>
            </div>
        </div>
    </div>

    <div id="help-overlay">
        <div class="help-modal">
            <button class="help-close-btn" onclick="closeHelp()">✕ Schließen</button>
            <h2>Hinweise</h2>
            <div class="help-feedback" id="help-feedback"></div>
            <div class="help-grid" id="help-grid"></div>
        </div>
    </div>

    <div id="right-dock">
        <div id="ui-panel" class="panel">
            <h3 style="margin:0 0 8px 0; font-size: 11px; text-transform: uppercase; color: #666;">Anzeige</h3>
            <button class="toggle-btn active" onclick="uiToggle('map', this)">🗺️ Karte</button>
            <button class="toggle-btn active" onclick="uiToggle('points', this)">🔵 Punkte S &amp; E</button>
            <button class="toggle-btn active" onclick="uiToggle('grid', this)">🏁 Gitter</button>
            <button class="toggle-btn" id="btn-gridmode" onclick="uiToggle('gridmode', this)">📏 Modus: 10x10</button>
        </div>

        <div id="tool-panel" class="panel">
            <h3 style="margin:0 0 8px 0; font-size: 11px; text-transform: uppercase; color: #666;">Werkzeuge</h3>
            <button class="action-btn" onclick="openModal()">➕ Punkt erstellen</button>
            <button class="action-btn" id="tri-tool-btn" onclick="activateTriangleTool()">📐 Dreieck erstellen</button>
            <hr style="border:0; border-top:1px solid #eee; margin:10px 0;">
            <button class="action-btn" style="color:#ff3b30; text-align:center" onclick="undo()">↩️ Rückgängig</button>
        </div>

        <div id="help-panel" class="panel">
            <h3 style="margin:0 0 8px 0; font-size: 11px; text-transform: uppercase; color: #666;">Hilfebereich</h3>
            <button class="action-btn" onclick="openHelp()">❓ Hinweise</button>
        </div>
    </div>
    <div id="panel-toggle" onclick="togglePanels()">❯</div>

    <div id="zoom-controls">
        <div class="control-btn" onclick="zoom(0.7)">+</div>
        <div class="control-btn" onclick="zoom(1.4)">−</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        let scene, camera, renderer, labelRenderer, controls, raycaster;
        let groundMesh, gridHelper, pointsGroup, trianglesGroup, uiGroup;

        let history = [];
        let triangleSelection = [];
        let isTriangleToolActive = false;
        let pointCounter = 0;
        let menuWasOpenBeforeFocus = true;

        // Gitterfarbe hängt davon ab, ob die Karte sichtbar ist: auf der (helleren)
        // Karte reicht ein helles Gitter, auf weißem Hintergrund wäre dasselbe
        // Gitter kaum zu erkennen -> dann dunklere Farbtöne verwenden.
        let mapVisible = true;
        let currentGridDivisions = 110; // Start: 10x10-Modus
        const GRID_COLORS_ON_MAP    = [0xcccccc, 0xeeeeee];
        const GRID_COLORS_NO_MAP    = [0x888888, 0xbbbbbb];

        // Punktfarben: Darkred statt Dunkelblau (R/B-Kanal gespiegelt, damit die
        // Helligkeit exakt vergleichbar bleibt) + kräftiges Hellrot als Auswahl-Highlight.
        const POINT_COLOR = 0x8b0000;
        const POINT_COLOR_SELECTED = 0xff4444;

        /* Seiten-Register: verhindert doppelte/falsche Seitennamen.
           Key = sortiertes Paar der Punkt-IDs einer Strecke (z. B. "E-S").
           So bleibt die Benennung auch bei mehrfachem Erstellen/Löschen von
           Punkten und Dreiecken konsistent. */
        let sideRegistry = new Map();

        // Achsen-Zahlen: Basisposition (auf der Achse) + Info, ob sie zur x₁- oder
        // x₂-Achse gehören. Der Versatz zur Achse wird pro Frame je nach Zoomstufe
        // neu berechnet (siehe updateTickLabelOffsets).
        let tickLabels = [];
        const TICK_LABEL_OFFSET = 15;

        /* --- Menü ein-/ausklappen --- */
        function updateToggleIcon() {
            document.getElementById('panel-toggle').textContent =
                document.body.classList.contains('panels-collapsed') ? '❮' : '❯';
        }
        function setPanelsCollapsed(state) {
            document.body.classList.toggle('panels-collapsed', state);
            updateToggleIcon();
        }
        window.togglePanels = () => {
            document.body.classList.toggle('panels-collapsed');
            updateToggleIcon();
        };

        /* --- Hilfebereich: stufenweise Hinweise (Prinzip wie helpdesk.html) ---
           Hinweis 1 ist von Anfang an nutzbar. Wird eine Karte umgeklappt, startet
           ein Countdown, nach dessen Ablauf der nächste Hinweis entsperrt wird.
           Bei Hinweis 1 & 2 erscheint zusätzlich nach einer Aufdeckzeit ein Button,
           der den Tipp direkt im Tool anwendet (siehe applyHint1/applyHint2). */
        const HINT_WAIT_SECONDS = 20;         // Wartezeit bis zum Entsperren des nächsten Hinweises
        const HINT_APPLY_REVEAL_SECONDS = HINT_WAIT_SECONDS; // Aufdeckzeit, bis der "Tipp im Tool anwenden"-Button erscheint (gleich lang wie die Sperre des nächsten Hinweises)
        const HINT_APPLY_RESET_SECONDS = 30;  // Neue Wartezeit für den nächsten gesperrten Hinweis nach Klick auf den Button

        const hintsData = [
            { text: 'Ergänzt die beiden Punkte S und E zu einem Dreieck, das euch weiterhelfen könnte.' },
            { text: 'Überlegt, warum euch ein rechtwinkliges Dreieck weiterhelfen wird.' },
            { text: 'In rechtwinkligen Dreiecken gilt der Satz des Pythagoras.' },
            { text: 'Um den Satz des Pythagoras anzuwenden, benötigt ihr die Information über mindestens zwei Seiten des Dreiecks.<br><br>1. Identifiziert also die Seiten eures Dreiecks: Wo liegen die Katheten, wo die Hypotenuse?<br>2. Welche Längen sind bekannt oder können berechnet bzw. abgelesen werden, welche ist gesucht?' },
            { text: 'Berechnet die Länge des Vektors schließlich mithilfe des Satzes des Pythagoras:', formula: '\\sqrt{\\text{Kathete}_1^{\\,2}+\\text{Kathete}_2^{\\,2}} = \\text{Hypotenuse}' }
        ];
        const hintState = {
            flipped: hintsData.map(() => false),
            timeLeft: hintsData.map(() => 0),
            locked: hintsData.map((_, i) => i !== 0), // nur Hinweis 1 ist initial entsperrt
            intervalId: hintsData.map(() => null),
            applyReady: hintsData.map(() => false),   // "Tipp im Tool anwenden"-Button sichtbar?
            wide: hintsData.map(() => false)          // Karte auf doppelte Breite vergrößert (Hinweis 5)
        };

        // Nur Hinweis 1 (Index 0) und Hinweis 2 (Index 1) besitzen eine Tool-Aktion.
        const hintActions = { 0: applyHint1, 1: applyHint2 };

        function buildApplyButtonHtml(i) {
            return `<button class="help-apply-btn" onclick="event.stopPropagation(); applyToolHint(${i})">Tipp im Tool anwenden</button>`;
        }

        function renderHintCards() {
            const grid = document.getElementById('help-grid');
            grid.innerHTML = hintsData.map((h, i) => {
                const isFlipped = hintState.flipped[i];
                const isLocked = hintState.locked[i];
                const currentTimer = hintState.timeLeft[i];
                const icon = isLocked ? '🔒' : (isFlipped ? '✅' : '💡');
                const timerText = currentTimer > 0 ? `Warten: ${currentTimer}s` : (isLocked ? 'Gesperrt' : '');
                const formulaHtml = h.formula ? `<div class="help-formula" id="help-formula-${i}"></div>` : '';
                const applyBtnHtml = (hintActions[i] && hintState.applyReady[i]) ? buildApplyButtonHtml(i) : '';
                const wideClass = hintState.wide[i] ? ' help-card-container-wide' : '';
                return `
                    <div class="help-card-container${wideClass}" id="help-card-container-${i}">
                        <div class="help-card ${isFlipped ? 'flipped' : ''} ${isLocked ? 'locked' : ''}" id="help-card-${i}" onclick="flipHintCard(${i})">
                            <div class="help-card-face help-card-front">
                                <div class="help-icon">${icon}</div>
                                <div class="help-title">Hinweis ${i + 1}</div>
                                <div class="help-timer" id="help-timer-${i}">${timerText}</div>
                            </div>
                            <div class="help-card-face help-card-back"><p>${h.text}</p>${formulaHtml}${applyBtnHtml}</div>
                        </div>
                    </div>
                `;
            }).join('');

            // LaTeX-Formeln (aktuell nur Hinweis 5) per KaTeX rendern
            hintsData.forEach((h, i) => {
                if (!h.formula) return;
                const el = document.getElementById(`help-formula-${i}`);
                if (el && window.katex) katex.render(h.formula, el, { throwOnError: false });
            });
        }

        window.openHelp = () => {
            renderHintCards();
            document.getElementById('help-overlay').classList.add('active');
        };
        window.closeHelp = () => document.getElementById('help-overlay').classList.remove('active');

        window.flipHintCard = (i) => {
            if (hintState.locked[i] || hintState.flipped[i]) return;
            hintState.flipped[i] = true;
            document.getElementById(`help-card-${i}`).classList.add('flipped');

            // Hinweis 5 (LaTeX-Formel): Karte beim Umklappen verdoppeln, damit die
            // Formel in einer Zeile passt.
            if (hintsData[i].formula) {
                hintState.wide[i] = true;
                const container = document.getElementById(`help-card-container-${i}`);
                if (container) container.classList.add('help-card-container-wide');
            }

            // Hinweis 1 & 2: nach Aufdeckzeit erscheint der "Tipp im Tool anwenden"-Button
            if (hintActions[i]) startApplyRevealTimer(i);

            const nextIdx = i + 1;
            if (hintsData[nextIdx] && hintState.timeLeft[nextIdx] === 0 && hintState.locked[nextIdx]) {
                startHintCountdown(nextIdx);
            }
        };

        function startHintCountdown(i, seconds = HINT_WAIT_SECONDS) {
            if (hintState.intervalId[i]) clearInterval(hintState.intervalId[i]);
            hintState.timeLeft[i] = seconds;

            const initEl = document.getElementById(`help-timer-${i}`);
            if (initEl) { initEl.textContent = 'Warten: ' + seconds + 's'; initEl.classList.remove('ready'); }

            hintState.intervalId[i] = setInterval(() => {
                hintState.timeLeft[i]--;

                // UI nur aktualisieren, falls der Hilfebereich gerade geöffnet ist
                const timerEl = document.getElementById(`help-timer-${i}`);
                if (timerEl) timerEl.textContent = 'Warten: ' + hintState.timeLeft[i] + 's';

                if (hintState.timeLeft[i] <= 0) {
                    clearInterval(hintState.intervalId[i]);
                    hintState.intervalId[i] = null;
                    hintState.locked[i] = false;
                    if (timerEl) {
                        timerEl.textContent = 'Bereit!';
                        timerEl.classList.add('ready');
                        const card = document.getElementById(`help-card-${i}`);
                        card.classList.remove('locked');
                        const icon = card.querySelector('.help-card-front .help-icon');
                        icon.textContent = '🔓';
                        icon.classList.add('pop');
                    }
                }
            }, 1000);
        }

        // Setzt nach Ablauf der Aufdeckzeit den "Tipp im Tool anwenden"-Button für
        // Hinweis i sichtbar (nur relevant für Hinweis 1 & 2).
        function startApplyRevealTimer(i) {
            setTimeout(() => {
                hintState.applyReady[i] = true;
                const card = document.getElementById(`help-card-${i}`);
                if (!card) return; // Hilfebereich aktuell geschlossen -> wird bei nächstem Öffnen korrekt gerendert
                const back = card.querySelector('.help-card-back');
                if (back && !back.querySelector('.help-apply-btn')) {
                    back.insertAdjacentHTML('beforeend', buildApplyButtonHtml(i));
                }
            }, HINT_APPLY_REVEAL_SECONDS * 1000);
        }

        // Klick auf "Tipp im Tool anwenden": führt die Aktion aus. Nur falls dabei
        // tatsächlich etwas im Tool verändert wurde (Punkt/Dreieck ergänzt), wird
        // danach der nächste noch nicht umgedrehte Hinweis für 30s neu gesperrt.
        // Hat die Aktion nichts verändert (z. B. "Keine Hilfe nötig"), passiert sonst nichts.
        window.applyToolHint = (i) => {
            const action = hintActions[i];
            if (!action) return;
            const didChangeSomething = action();
            if (didChangeSomething) relockNextUnflippedHint(i);
        };

        // Sucht ab fromIndex den nächsten Hinweis, der noch nicht umgedreht wurde
        // (egal ob er gerade noch läuft oder bereits entsperrt/"bereit" war, aber
        // vom Lernenden noch nicht angesehen wurde) und sperrt ihn für 30s neu.
        function relockNextUnflippedHint(fromIndex) {
            for (let j = fromIndex + 1; j < hintsData.length; j++) {
                if (hintState.flipped[j]) continue; // bereits umgedreht -> überspringen

                if (!hintState.locked[j]) {
                    // War schon entsperrt ("bereit"), aber noch nicht angesehen -> erneut sperren
                    hintState.locked[j] = true;
                    const card = document.getElementById(`help-card-${j}`);
                    if (card) {
                        card.classList.add('locked');
                        const icon = card.querySelector('.help-card-front .help-icon');
                        if (icon) { icon.textContent = '🔒'; icon.classList.remove('pop'); }
                    }
                }
                startHintCountdown(j, HINT_APPLY_RESET_SECONDS);
                return;
            }
        }

        let helpFeedbackTimeout = null;
        function showHintFeedback(message, isSuccess = true) {
            const el = document.getElementById('help-feedback');
            if (!el) return;
            el.textContent = message;
            el.classList.toggle('info', !isSuccess);
            el.classList.add('show');
            if (helpFeedbackTimeout) clearTimeout(helpFeedbackTimeout);
            helpFeedbackTimeout = setTimeout(() => el.classList.remove('show'), 4000);
        }

        // Kandidaten-Koordinaten für den dritten Dreieckspunkt (siehe Hinweis 1 & 2)
        const HINT_CANDIDATE_POINTS = [{ x: 160, y: 80 }, { x: 200, y: 330 }];

        function findPointById(id) {
            return pointsGroup.children.find(p => p.userData.id === id) || null;
        }
        function findPointAt(x, y) {
            return pointsGroup.children.find(p => p.position.x === x && p.position.y === y) || null;
        }
        function triangleHasPoints(...points) {
            return trianglesGroup.children.some(g => g.userData.pts && points.every(pt => g.userData.pts.includes(pt)));
        }

        // Hinweis 1: ergänzt zufällig einen der beiden möglichen dritten Punkte –
        // aber nur, falls noch keiner der beiden (an seiner Koordinate) existiert.
        // Rückgabewert: true, falls dabei tatsächlich ein Punkt ergänzt wurde.
        function applyHint1() {
            const alreadyExists = HINT_CANDIDATE_POINTS.some(c => findPointAt(c.x, c.y));
            if (alreadyExists) { showHintFeedback('Keine Hilfe im Tool nötig ✅'); return false; }
            const choice = HINT_CANDIDATE_POINTS[Math.floor(Math.random() * HINT_CANDIDATE_POINTS.length)];
            const p = spawnPoint(choice.x, choice.y, getNextPointName());
            history.push({ type: 'addPoint', obj: p });
            showHintFeedback(`Punkt (${choice.x}|${choice.y}) wurde ergänzt.`);
            return true;
        }

        // Hinweis 2: legt das Dreieck S-E-(P oder Q) an, falls einer der beiden
        // Kandidaten-Punkte existiert und noch nicht entsprechend verbunden ist.
        // Rückgabewert: true, falls dabei tatsächlich ein Dreieck ergänzt wurde.
        function applyHint2() {
            const sPoint = findPointById('S'), ePoint = findPointById('E');
            for (const c of HINT_CANDIDATE_POINTS) {
                const pt = findPointAt(c.x, c.y);
                if (pt && triangleHasPoints(sPoint, ePoint, pt)) {
                    showHintFeedback('Keine Hilfe im Tool nötig ✅');
                    return false;
                }
            }
            const existing = HINT_CANDIDATE_POINTS.map(c => findPointAt(c.x, c.y)).find(pt => pt);
            if (existing) {
                createTriangle(sPoint, ePoint, existing);
                showHintFeedback('Dreieck mit S und E wurde ergänzt.');
                return true;
            }
            showHintFeedback('Es existiert noch kein passender dritter Punkt (P oder Q).', false);
            return false;
        }

        const mapConfig = {
            sPx: { x: 660, y: 394 }, s2D: { x: 160, y: 330 },
            ePx: { x: 745, y: 911 }, e2D: { x: 200, y: 80 },
            imgW: 1380, imgH: 1394, focus: { x: 180, y: 210 }
        };

        const pointLetters = ['P', 'Q', 'R', 'T', 'U', 'V', 'W'];

        function getNextPointName() {
            const index = pointCounter % pointLetters.length;
            const suffix = Math.floor(pointCounter / pointLetters.length);
            pointCounter++;
            return suffix === 0 ? pointLetters[index] : `${pointLetters[index]}${suffix}`;
        }

        window.openModal = () => document.getElementById('modal-overlay').style.display = 'flex';
        window.closeModal = () => document.getElementById('modal-overlay').style.display = 'none';
        window.confirmPointCreation = () => {
            const x1 = parseFloat(document.getElementById('mod-x1').value);
            const x2 = parseFloat(document.getElementById('mod-x2').value);
            if (!isNaN(x1) && !isNaN(x2)) {
                const p = spawnPoint(x1, x2, getNextPointName());
                history.push({ type: 'addPoint', obj: p });
            }
            closeModal();
        };

        window.uiToggle = (type, btn) => {
            if (type === 'gridmode') {
                const divisions = btn.textContent.includes("5x5") ? 110 : 220;
                currentGridDivisions = divisions;
                rebuildGrid();
                btn.textContent = divisions === 220 ? "📏 Modus: 5x5" : "📏 Modus: 10x10";
                return;
            }
            btn.classList.toggle('active');
            const isVis = btn.classList.contains('active');
            if(type === 'map') {
                groundMesh.visible = isVis;
                // Ohne Karte ist der weiße Hintergrund heller als die Kartenfläche –
                // damit das Gitter dort trotzdem gut sichtbar bleibt, dunkler einfärben.
                mapVisible = isVis;
                rebuildGrid();
            }
            if(type === 'grid') gridHelper.visible = isVis;
            if(type === 'points') {
                pointsGroup.visible = isVis;
                pointsGroup.traverse(c => { if(c instanceof CSS2DObject) c.visible = isVis; });
            }
        };

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            const aspect = window.innerWidth / window.innerHeight;
            const vSize = 280;
            camera = new THREE.OrthographicCamera(-vSize*aspect, vSize*aspect, vSize, -vSize, 0.1, 2000);
            camera.position.set(mapConfig.focus.x, mapConfig.focus.y, 500);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0px';
            labelRenderer.domElement.style.pointerEvents = 'none';
            document.body.appendChild(labelRenderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableRotate = false;
            controls.screenSpacePanning = true;
            controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY };
            controls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_PAN };
            controls.target.set(mapConfig.focus.x, mapConfig.focus.y, 0);

            raycaster = new THREE.Raycaster();
            pointsGroup = new THREE.Group();
            trianglesGroup = new THREE.Group();
            uiGroup = new THREE.Group();
            scene.add(trianglesGroup, pointsGroup, uiGroup);

            addAxes();
            addFineGrid();
            addGroundMap();
            addReferencePoints();

            /* Tap-Erkennung: nur echte Tipps (Bewegung < 10 px, Dauer < 500 ms)
               wählen aus / öffnen Popups. Wisch-/Pan-Gesten werden ignoriert. */
            let tapStart = null;
            renderer.domElement.addEventListener('pointerdown', (e) => {
                tapStart = { x: e.clientX, y: e.clientY, t: performance.now() };
            });
            renderer.domElement.addEventListener('pointercancel', () => { tapStart = null; });
            renderer.domElement.addEventListener('pointerup', (e) => {
                if (!tapStart) return;
                const dist = Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y);
                const dur = performance.now() - tapStart.t;
                tapStart = null;
                if (dist < 10 && dur < 500) handleTap(e);
            });

            /* iPad/Safari: System-Pinch-Zoom der Seite unterdrücken */
            ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
                document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));

            window.addEventListener('resize', onResize);
            window.addEventListener('orientationchange', () => setTimeout(onResize, 300));
            updateToggleIcon();
            animate();
        }

        function addAxes() {
            const mat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const axes = [{ v: new THREE.Vector3(1,0,0), l: 'x₁', len: 325, start: -15 }, { v: new THREE.Vector3(0,1,0), l: 'x₂', len: 350, start: -15 }];
            axes.forEach(axis => {
                const line = new THREE.Mesh(new THREE.PlaneGeometry(axis.v.x ? axis.len-axis.start : 1.2, axis.v.y ? axis.len-axis.start : 1.2), mat);
                line.position.copy(axis.v.clone().multiplyScalar((axis.len+axis.start)/2));
                scene.add(line);
                const shape = new THREE.Shape();
                shape.moveTo(0, 5); shape.lineTo(3.5, -5); shape.lineTo(-3.5, -5);
                const head = new THREE.Mesh(new THREE.ShapeGeometry(shape), mat);
                head.position.copy(axis.v.clone().multiplyScalar(axis.len));
                if(axis.v.x) head.rotation.z = -Math.PI/2;
                scene.add(head);
                const div = document.createElement('div');
                div.className = 'axis-label'; div.textContent = axis.l;
                const label = new CSS2DObject(div);
                label.position.copy(axis.v.clone().multiplyScalar(axis.len + 12.5));
                scene.add(label);
                for (let i = -10; i <= axis.len - 15; i += 10) {
                    if (i === 0) continue;
                    const tick = new THREE.Mesh(new THREE.PlaneGeometry(axis.v.x ? 0.8 : 5, axis.v.y ? 0.8 : 5), mat);
                    tick.position.copy(axis.v.clone().multiplyScalar(i));
                    scene.add(tick);
                    // Zahlen an jedem 20er-Schritt (10er-Ticks blieben zu dicht am Ursprung)
                    if (i % 20 === 0) {
                        const tDiv = document.createElement('div');
                        tDiv.className = 'tick-label'; tDiv.textContent = i;
                        const tL = new CSS2DObject(tDiv);
                        const base = axis.v.clone().multiplyScalar(i);
                        tL.position.copy(base);
                        scene.add(tL);
                        // Abstand zur Achse in Weltkoordinaten – wird pro Frame an den
                        // Zoom angepasst, damit die Zahlen beim Ranzoomen näher an die
                        // Ticks rücken statt optisch weiter wegzudriften.
                        tickLabels.push({ obj: tL, base, isXAxis: !!axis.v.x });
                    }
                }
            });
        }

        function spawnPoint(x, y, txt, isRef = false) {
            const circle = new THREE.Mesh(new THREE.CircleGeometry(2, 32), new THREE.MeshBasicMaterial({ color: POINT_COLOR }));
            circle.position.set(x, y, 0.5);
            circle.userData = { id: txt, isRef: isRef, coords: `(${x}|${y})` };
            const div = document.createElement('div');
            div.className = 'point-label'; div.textContent = txt;
            const label = new CSS2DObject(div);
            label.position.set(6, 2, 0);
            circle.add(label);
            circle.userData.label = label;
            pointsGroup.add(circle);
            return circle;
        }

        window.activateTriangleTool = () => {
            isTriangleToolActive = !isTriangleToolActive;
            triangleSelection = [];
            clearPopups();
            document.getElementById('tri-tool-btn').classList.toggle('active', isTriangleToolActive);
            document.getElementById('instruction-toast').style.display = isTriangleToolActive ? 'block' : 'none';

            /* Intelligenter Fokus-Modus: beim Aktivieren Menü einklappen,
               beim Verlassen (manuell oder nach fertigem Dreieck) den vorherigen
               Zustand wiederherstellen. */
            if (isTriangleToolActive) {
                menuWasOpenBeforeFocus = !document.body.classList.contains('panels-collapsed');
                setPanelsCollapsed(true);
            } else {
                setPanelsCollapsed(!menuWasOpenBeforeFocus);
            }
        };

        // Wählt den Namen einer neuen Seite: bevorzugt der Kleinbuchstabe des
        // gegenüberliegenden Punkts. Ist dieser schon für eine andere Seite vergeben,
        // wird der nächste freie Buchstabe genommen (alphabetisch weiter, nach z wieder
        // ab a), der weder als Seitenname noch als Großbuchstabe eines Punkts vorkommt.
        function pickSideName(oppId) {
            const usedBySides = new Set([...sideRegistry.values()].map(e => e.name));
            const preferred = oppId.charAt(0).toLowerCase();
            if (!usedBySides.has(preferred)) return preferred;

            const usedByPoints = new Set(pointsGroup.children.map(p => p.userData.id.charAt(0).toLowerCase()));
            const start = preferred.charCodeAt(0) - 97;
            for (let k = 1; k < 26; k++) {
                const letter = String.fromCharCode(97 + (start + k) % 26);
                if (!usedBySides.has(letter) && !usedByPoints.has(letter)) return letter;
            }
            // Fallback (alle 26 Buchstaben belegt): Index anhängen
            let n = 2;
            while (usedBySides.has(preferred + n)) n++;
            return preferred + n;
        }

        function createTriangle(pt1, pt2, pt3) {
            const p1 = pt1.position, p2 = pt2.position, p3 = pt3.position;
            const group = new THREE.Group();
            const color = new THREE.Color().setHSL(Math.random(), 0.7, 0.6);
            const createdSideKeys = [];
            const createdSides = [];

            const shape = new THREE.Shape();
            shape.moveTo(p1.x, p1.y); shape.lineTo(p2.x, p2.y); shape.lineTo(p3.x, p3.y);
            const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.3, side: THREE.DoubleSide }));
            mesh.position.z = 0.1; group.add(mesh);

            const edgePoints = [p1, p2, p3, p1];
            for(let i=0; i<3; i++) {
                const start = edgePoints[i], end = edgePoints[i+1];
                const dx = end.x - start.x, dy = end.y - start.y;
                const line = new THREE.Mesh(new THREE.PlaneGeometry(Math.sqrt(dx*dx + dy*dy), 1.25), new THREE.MeshBasicMaterial({ color: 0x000000 }));
                line.position.set(start.x + dx/2, start.y + dy/2, 0.15);
                line.rotation.z = Math.atan2(dy, dx);
                group.add(line);
            }

            // Jede Seite wird über das Paar ihrer Endpunkte identifiziert (nicht über
            // den gegenüberliegenden Punkt) und nach dem gegenüberliegenden Punkt
            // benannt (Kleinbuchstabe). Das gilt auch für die Strecke S–E.
            const sides = [
                { pa: pt2, pb: pt3, opp: pt1 },
                { pa: pt1, pb: pt3, opp: pt2 },
                { pa: pt1, pb: pt2, opp: pt3 }
            ];
            sides.forEach(s => {
                const idA = s.pa.userData.id, idB = s.pb.userData.id;
                const key = [idA, idB].sort().join('-');
                if (sideRegistry.has(key)) return; // Seite existiert schon -> bisherige Beschriftung bleibt

                const txt = pickSideName(s.opp.userData.id);

                const mid = new THREE.Vector3().addVectors(s.pa.position, s.pb.position).multiplyScalar(0.5);
                const div = document.createElement('div');
                div.className = 'side-label'; div.textContent = txt;
                const cssLabel = new CSS2DObject(div);
                cssLabel.position.set(mid.x, mid.y, 0.3);
                group.add(cssLabel);
                const entry = { name: txt, labelObj: cssLabel };
                sideRegistry.set(key, entry);
                createdSides.push({ key, entry });
                createdSideKeys.push(key);
            });

            const pts = [p1, p2, p3];
            for(let i=0; i<3; i++) {
                const A = pts[i], B = pts[(i+1)%3], C = pts[(i+2)%3];
                const v1 = new THREE.Vector2().subVectors(A, B).normalize();
                const v2 = new THREE.Vector2().subVectors(C, B).normalize();
                if(Math.abs(v1.dot(v2)) < 0.05) {
                    const size = 14;
                    const a1 = Math.atan2(v1.y, v1.x), a2 = Math.atan2(v2.y, v2.x);
                    let diff = a2 - a1;
                    while (diff < -Math.PI) diff += 2 * Math.PI;
                    while (diff > Math.PI) diff -= 2 * Math.PI;
                    const arcShape = new THREE.Shape();
                    arcShape.moveTo(0,0);
                    arcShape.absarc(0,0, size, a1, a1 + diff, diff < 0);
                    const arc = new THREE.Line(new THREE.BufferGeometry().setFromPoints(arcShape.getPoints(20)), new THREE.LineBasicMaterial({color: 0, linewidth: 3}));
                    const midAngle = a1 + diff/2;
                    const dot = new THREE.Mesh(new THREE.CircleGeometry(1.2, 16), new THREE.MeshBasicMaterial({color: 0}));
                    dot.position.set(Math.cos(midAngle)*size*0.65, Math.sin(midAngle)*size*0.65, 0);
                    const g = new THREE.Group(); g.add(arc, dot); g.position.set(B.x, B.y, 0.2); group.add(g);
                }
            }
            group.userData = { pts: [pt1, pt2, pt3], sideKeys: createdSideKeys, sides: createdSides };
            trianglesGroup.add(group);
            history.push({ type: 'addTri', obj: group, sideKeys: createdSideKeys });
        }

        /* --- Popups & Löschen --- */
        function clearPopups() {
            pointsGroup.children.forEach(p => {
                if (p.userData.popup) {
                    p.remove(p.userData.popup);
                    if (p.userData.popup.element) p.userData.popup.element.remove();
                    p.userData.popup = null;
                }
            });
        }

        function showPopup(p) {
            const div = document.createElement('div');
            div.className = 'coord-popup';
            const span = document.createElement('span');
            span.textContent = p.userData.coords;
            div.appendChild(span);
            if (!p.userData.isRef) {   // S und E sind fest eingezeichnet und nicht löschbar
                const del = document.createElement('button');
                del.className = 'del-btn';
                del.innerHTML = '🗑️';
                del.addEventListener('click', (ev) => { ev.stopPropagation(); deletePoint(p); });
                div.appendChild(del);
            }
            const popup = new CSS2DObject(div);
            popup.position.set(0, -12, 0);
            p.add(popup);
            p.userData.popup = popup;
        }

        // CSS2D-Beschriftungen eines (aus dem Szenengraph gelösten) Dreiecks ein-/ausblenden
        function setTriangleHidden(g, hidden) {
            g.traverse(c => { if (c instanceof CSS2DObject && c.element) c.element.style.display = hidden ? 'none' : ''; });
        }

        function deletePoint(p) {
            clearPopups();

            // Alle Dreiecke, die diesen Punkt als Eckpunkt haben, komplett entfernen
            // (Fläche, Kanten, Winkelsymbol UND Seitenbeschriftungen).
            const affected = trianglesGroup.children.filter(g => g.userData.pts && g.userData.pts.includes(p));
            affected.forEach(g => {
                trianglesGroup.remove(g);
                setTriangleHidden(g, true);
                (g.userData.sideKeys || []).forEach(k => sideRegistry.delete(k));
            });

            pointsGroup.remove(p);
            if (p.userData.label && p.userData.label.element) p.userData.label.element.style.display = 'none';
            history.push({ type: 'del', obj: p, triangles: affected });
        }

        function handleTap(e) {
            const rect = renderer.domElement.getBoundingClientRect();
            const mouseVec = new THREE.Vector2(
                ((e.clientX - rect.left) / rect.width) * 2 - 1,
                -((e.clientY - rect.top) / rect.height) * 2 + 1
            );
            raycaster.setFromCamera(mouseVec, camera);
            const intersects = raycaster.intersectObjects(pointsGroup.children.filter(p => p.visible));
            const hit = intersects.length > 0 ? intersects[0].object : null;

            if (isTriangleToolActive) {
                // Während des Dreieck-Tools: nur Treffer auf Punkte lösen Aktionen aus
                if (!hit) return;
                if (triangleSelection.includes(hit)) return;
                triangleSelection.push(hit);
                hit.material.color.set(POINT_COLOR_SELECTED);
                if (triangleSelection.length === 3) {
                    createTriangle(triangleSelection[0], triangleSelection[1], triangleSelection[2]);
                    triangleSelection.forEach(pt => pt.material.color.set(POINT_COLOR));
                    activateTriangleTool(); // Fokus-Modus verlassen, Menü zurückholen
                }
                return;
            }

            const hadPopup = hit && hit.userData.popup;
            clearPopups();
            if (!hit) return;               // Klick ins Leere schließt nur das Popup
            if (hadPopup) return;           // erneuter Tap auf denselben Punkt -> schließen
            showPopup(hit);
        }

        window.undo = () => {
            const h = history.pop(); if(!h) return;
            if(h.type==='addPoint') {
                clearPopups();
                pointsGroup.remove(h.obj);
                h.obj.traverse(c => { if(c instanceof CSS2DObject) c.element.remove(); });
                pointCounter = Math.max(0, pointCounter - 1);
            }
            if(h.type==='del') {
                pointsGroup.add(h.obj);
                if (h.obj.userData.label && h.obj.userData.label.element) h.obj.userData.label.element.style.display = '';
                // Mitgelöschte Dreiecke samt Seitenbeschriftungen wiederherstellen
                (h.triangles || []).forEach(g => {
                    trianglesGroup.add(g);
                    setTriangleHidden(g, false);
                    (g.userData.sides || []).forEach(({ key, entry }) => sideRegistry.set(key, entry));
                });
            }
            if(h.type==='addTri') {
                trianglesGroup.remove(h.obj);
                h.obj.traverse(c => { if(c instanceof CSS2DObject) c.element.remove(); });
                // Nur die von diesem Dreieck vergebenen Seitennamen wieder freigeben
                (h.sideKeys || []).forEach(k => sideRegistry.delete(k));
            }
        };

        // Baut das Gitter neu auf (Divisionen + Farbe je nach Karten-Sichtbarkeit),
        // ohne die aktuelle Sichtbarkeit (an/aus) zu verändern.
        function rebuildGrid() {
            const vis = gridHelper ? gridHelper.visible : true;
            if (gridHelper) scene.remove(gridHelper);
            const [major, minor] = mapVisible ? GRID_COLORS_ON_MAP : GRID_COLORS_NO_MAP;
            gridHelper = new THREE.GridHelper(1100, currentGridDivisions, major, minor);
            gridHelper.rotation.x = Math.PI / 2; gridHelper.position.z = -0.1;
            gridHelper.visible = vis;
            scene.add(gridHelper);
        }

        function addFineGrid() {
            // Standardmäßig 10x10-Modus (110 Divisionen = 10 Einheiten pro Zelle)
            rebuildGrid();
        }

        function addReferencePoints() {
            spawnPoint(mapConfig.s2D.x, mapConfig.s2D.y, 'S', true);
            spawnPoint(mapConfig.e2D.x, mapConfig.e2D.y, 'E', true);
        }

        function addGroundMap() {
            new THREE.TextureLoader().load('karte.png', (texture) => {
                const { x: sx, y: sy } = mapConfig.s2D;
                const { x: ex, y: ey } = mapConfig.e2D;
                const { x: spx, y: spy } = mapConfig.sPx;
                const { x: epx, y: epy } = mapConfig.ePx;
                const d3d = Math.sqrt(Math.pow(ex-sx,2) + Math.pow(ey-sy,2));
                const dPx = Math.sqrt(Math.pow(epx-spx,2) + Math.pow(epy-spy,2));
                const scale = d3d / dPx;
                groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(mapConfig.imgW * scale, mapConfig.imgH * scale), new THREE.MeshBasicMaterial({ map: texture, transparent: true, opacity: 0.85 }));
                groundMesh.rotation.z = Math.atan2(ey-sy, ex-sx) - Math.atan2(-(epy-spy), epx-spx);
                const lVect = new THREE.Vector2((spx-mapConfig.imgW/2)*scale, (mapConfig.imgH/2-spy)*scale).rotateAround(new THREE.Vector2(0,0), groundMesh.rotation.z);
                groundMesh.position.set(sx - lVect.x, sy - lVect.y, -0.5);
                scene.add(groundMesh);
            });
        }

        window.zoom = (f) => { camera.zoom /= f; camera.updateProjectionMatrix(); };
        function onResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const vSize = 280;
            camera.left = -vSize*aspect; camera.right = vSize*aspect;
            camera.top = vSize; camera.bottom = -vSize;
            camera.updateProjectionMatrix();
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }
        function updateTickLabelOffsets() {
            // Bei OrthographicCamera vergrößert steigender zoom die Darstellung,
            // ein fester Weltraum-Versatz würde also beim Ranzoomen optisch
            // größer wirken. Deshalb Versatz umgekehrt proportional zum Zoom.
            const off = TICK_LABEL_OFFSET / camera.zoom;
            tickLabels.forEach(t => {
                if (t.isXAxis) t.obj.position.set(t.base.x, t.base.y + off, t.base.z);
                else t.obj.position.set(t.base.x + off, t.base.y, t.base.z);
            });
        }
        function animate() { requestAnimationFrame(animate); controls.update(); updateTickLabelOffsets(); renderer.render(scene, camera); labelRenderer.render(scene, camera); }
    </script>
</body>
</html>
